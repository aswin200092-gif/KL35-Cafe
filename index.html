<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c3b38"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Snack counter</title>
<style>
:root{--bg:#dcebe6;--card:#f7fbf9;--tx:#0b2b29;--mu:#4a6a65;--bd:#a9c5bd;--ct:#0e6b64;--ac:#e8a33d;--actx:#2a1a00;--paper:#fffaf0;--ptx:#2b2416;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c3b38;--card:#12514d;--tx:#f3efe2;--mu:#9fc3bb;--bd:#2c6e68;--ct:#f2b84b;--ac:#f2b84b;--paper:#f6efdc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c3b38;--card:#12514d;--tx:#f3efe2;--mu:#9fc3bb;--bd:#2c6e68;--ct:#f2b84b;--ac:#f2b84b;--paper:#f6efdc;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.45 "Anek Malayalam",system-ui,-apple-system,"Noto Sans Malayalam",sans-serif;padding:14px 14px 28px}
.top{position:sticky;top:0;z-index:5;padding-top:6px;background:var(--bg)}
.slab{background:var(--ac);color:var(--actx);border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.slab b{font-size:44px;font-weight:700;line-height:1}
.slab span{font-size:17px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.it{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:14px;text-align:left;color:var(--tx);font:inherit;min-height:124px;display:flex;flex-direction:column;justify-content:space-between;position:relative;-webkit-tap-highlight-color:transparent;cursor:pointer}
.it:active{transform:scale(.96)}
.it:focus-visible,.btn:focus-visible,.minus:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.it .n{font-size:20px;font-weight:700;line-height:1.2;padding-right:30px}
.it .p{font-size:14px;color:var(--mu)}
.it .c{font-size:44px;font-weight:700;line-height:1;color:var(--ct)}
.it.z{background:transparent;border-style:dashed}
.it.z .c{color:var(--bd)}
.pop .c{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop .c{animation:none}.it:active{transform:none}}
.minus{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font-size:22px;line-height:1}
.row{display:flex;gap:12px}
.btn{flex:1;min-height:58px;border-radius:18px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.btn.pri{flex:2;background:var(--ac);color:var(--actx);border-color:var(--ac)}
h2{font-size:18px;font-weight:700;margin:26px 0 10px}
.slip{background:var(--paper);color:var(--ptx);border-radius:6px;padding:14px 16px;position:relative}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--paper) 5.5px) 0 0/12px 8px repeat-x}
.slip::before{top:-8px}
.slip::after{bottom:-8px;transform:scaleY(-1)}
.h{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #b9ad90;font-size:16px}
.h:last-child{border-bottom:none}
.h.hd{font-weight:700;font-size:18px;padding-bottom:10px;border-bottom:2px solid var(--ptx)}
.ed{display:flex;gap:8px;margin-bottom:8px}
.ed input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.ed input[type=number]{flex:0 0 84px}
.lnk{background:none;border:none;color:var(--mu);font:inherit;text-decoration:underline;padding:14px 0;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="slab"><b id="tp">₹0</b><span id="tn">0 snacks</span></div></div>
<div class="grid" id="g"></div>
<div class="row"><button class="btn" id="undo">Undo</button><button class="btn pri" id="done">Done</button></div>
<h2>Today</h2>
<div class="slip" id="sum"></div>
<button class="btn" id="endday" style="width:100%;margin-top:22px">End day</button>
<h2>Past days</h2>
<div class="slip" id="past"></div>
<button class="lnk" id="edit">Edit menu and prices</button>
<div id="ed" hidden></div>
<script>
var K='snackapp1',S,last=null;
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.items)S={items:[['പഴംപൊരി',10],['ഉള്ളിവട',10],['മുട്ട ബജി',15],['മുളക് ബജി',10],['കാടമുട്ട',10],['എഗ്ഗ് റോസ്റ്റ്',20]],cur:{},stack:[],hist:[],days:[]};if(!S.day)S.day=String(Date.now());if(!S.days)S.days=[]}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function vib(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function tot(c){var n=0,p=0;S.items.forEach(function(it){var k=c[it[0]]||0;n+=k;p+=k*it[1]});return[n,p]}
function today(){return S.day}
function pr(k){for(var i=0;i<S.items.length;i++)if(S.items[i][0]===k)return S.items[i][1];return 0}
function render(){
var g=document.getElementById('g');g.innerHTML='';
S.items.forEach(function(it){
var c=S.cur[it[0]]||0,b=document.createElement('button');
b.className='it'+(c?'':' z')+(last===it[0]?' pop':'');
b.innerHTML='<span class="n"></span><span class="p">₹'+it[1]+'</span><span class="c">'+c+'</span>';
b.querySelector('.n').textContent=it[0];
b.onclick=function(){last=it[0];S.cur[it[0]]=c+1;S.stack.push(it[0]);vib();save();render()};
if(c){var m=document.createElement('span');m.className='minus';m.textContent='−';m.setAttribute('aria-label','Remove one');
m.onclick=function(e){e.stopPropagation();S.cur[it[0]]=c-1;var i=S.stack.lastIndexOf(it[0]);if(i>-1)S.stack.splice(i,1);save();render()};b.appendChild(m)}
g.appendChild(b)});last=null;
var t=tot(S.cur);
document.getElementById('tp').textContent='₹'+t[1];
document.getElementById('tn').textContent=t[0]+(t[0]==1?' snack':' snacks');
var agg={},d=today(),gp=0,gn=0,groups=0;
S.hist.forEach(function(h){if(h.d!==d)return;groups++;for(var k in h.c){agg[k]=(agg[k]||0)+h.c[k]}var x=tot(h.c);gn+=x[0];gp+=x[1]});
var s=document.getElementById('sum');s.innerHTML='';
if(!groups){s.innerHTML='<div class="h"><span>No groups saved yet.</span></div>'}
else{var l=document.createElement('div');l.className='h hd';l.innerHTML='<span>'+groups+' groups · '+gn+' snacks</span><b>₹'+gp+'</b>';s.appendChild(l);
for(var k in agg){var r=document.createElement('div');r.className='h';var a=document.createElement('span');a.textContent=k;var q=document.createElement('b');q.textContent=agg[k]+' × ₹'+pr(k)+' = ₹'+agg[k]*pr(k);r.appendChild(a);r.appendChild(q);s.appendChild(r)}}}
var _r=render;render=function(){_r();var p=document.getElementById('past');p.innerHTML='';if(!S.days.length){p.innerHTML='<div class="h"><span>No closed days yet.</span></div>';return}S.days.slice().reverse().forEach(function(d){var r=document.createElement('div');r.className='h';var a=document.createElement('span');a.textContent=d.label+' · '+d.n+' snacks';var q=document.createElement('b');q.textContent='₹'+d.p;r.appendChild(a);r.appendChild(q);p.appendChild(r);if(d.c){r.style.borderBottom='none';var t=document.createElement('div');t.style.cssText='font-size:14px;padding:0 0 8px;border-bottom:1px dashed #b9ad90;color:#5a4f38';var ps=[];for(var k in d.c)ps.push(k+' '+d.c[k]);t.textContent=ps.join(' · ');p.appendChild(t)}})};
document.getElementById('endday').onclick=function(){var n=0,p=0,c=0,ag={},d=S.day;S.hist.forEach(function(h){if(h.d!==d)return;c++;var x=tot(h.c);n+=x[0];p+=x[1];for(var k in h.c)ag[k]=(ag[k]||0)+h.c[k]});if(!c){alert('No groups saved today.');return}if(!confirm('End the day? Total: '+n+' snacks, ₹'+p+'.'))return;S.days.push({label:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),n:n,p:p,c:ag});S.hist=S.hist.filter(function(h){return h.d!==d});S.day=String(Date.now());save();render()};
document.getElementById('undo').onclick=function(){var k=S.stack.pop();if(k&&S.cur[k]>0){S.cur[k]--}save();render()};
document.getElementById('done').onclick=function(){var t=tot(S.cur);if(!t[0]){alert('Tap a snack first.');return}
S.hist.push({d:today(),c:S.cur});S.cur={};S.stack=[];save();vib();render()};
document.getElementById('edit').onclick=function(){var e=document.getElementById('ed');if(!e.hidden){e.hidden=true;render();return}
e.hidden=false;e.innerHTML='';
S.items.forEach(function(it,i){var r=document.createElement('div');r.className='ed';
var a=document.createElement('input');a.value=it[0];a.onchange=function(){S.cur[a.value]=S.cur[it[0]]||0;it[0]=a.value;save();render()};
var p=document.createElement('input');p.type='number';p.value=it[1];p.onchange=function(){it[1]=Number(p.value)||0;save();render()};
var x=document.createElement('button');x.textContent='×';x.className='btn';x.style.flex='0 0 48px';x.style.minHeight='40px';x.onclick=function(){S.items.splice(i,1);save();document.getElementById('edit').onclick();document.getElementById('edit').onclick();render()};
r.appendChild(a);r.appendChild(p);r.appendChild(x);e.appendChild(r)});
var add=document.createElement('button');add.className='btn';add.textContent='Add item';
add.onclick=function(){S.items.push(['New item',10]);save();document.getElementById('edit').onclick();document.getElementById('edit').onclick();render()};
e.appendChild(add)};
load();render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
</html>
