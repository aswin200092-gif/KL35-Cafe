<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c3b38"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Snack counter</title>
<style>
:root{--bg:#dcebe6;--card:#f7fbf9;--tx:#0b2b29;--mu:#4a6a65;--bd:#a9c5bd;--ct:#0e6b64;--ac:#e8a33d;--actx:#2a1a00;--paper:#fffaf0;--ptx:#2b2416;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c3b38;--card:#12514d;--tx:#f3efe2;--mu:#9fc3bb;--bd:#2c6e68;--ct:#f2b84b;--ac:#f2b84b;--paper:#f6efdc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c3b38;--card:#12514d;--tx:#f3efe2;--mu:#9fc3bb;--bd:#2c6e68;--ct:#f2b84b;--ac:#f2b84b;--paper:#f6efdc;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.45 "Anek Malayalam",system-ui,-apple-system,"Noto Sans Malayalam",sans-serif;padding:14px 14px 28px}
.top{position:sticky;top:0;z-index:5;padding-top:6px;background:var(--bg)}
.slab{background:var(--ac);color:var(--actx);border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.slab b{font-size:44px;font-weight:700;line-height:1}
.slab span{font-size:17px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.it{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:14px;text-align:left;color:var(--tx);font:inherit;min-height:124px;display:flex;flex-direction:column;justify-content:space-between;position:relative;-webkit-tap-highlight-color:transparent;cursor:pointer}
.it:active{transform:scale(.96)}
.it:focus-visible,.btn:focus-visible,.minus:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.it .n{font-size:20px;font-weight:700;line-height:1.2;padding-right:30px}
.it .p{font-size:14px;color:var(--mu)}
.it .c{font-size:44px;font-weight:700;line-height:1;color:var(--ct)}
.it.z{background:transparent;border-style:dashed}
.it.z .c{color:var(--bd)}
.pop .c{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop .c{animation:none}.it:active{transform:none}}
.minus{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font-size:22px;line-height:1}
.row{display:flex;gap:12px}
.btn{flex:1;min-height:58px;border-radius:18px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.btn.pri{flex:2;background:var(--ac);color:var(--actx);border-color:var(--ac)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}.tab{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:14px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-weight:700;white-space:nowrap;cursor:pointer}.tab.on{background:var(--card);border-color:var(--ac)}.tab i{font-style:normal;color:var(--ct);margin-left:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.bd summary{font-weight:700;font-size:17px;padding:16px 0 12px;cursor:pointer}.bd .slip{margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;z-index:30;white-space:nowrap}.toast[hidden],#mv[hidden]{display:none}
#mv{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}.box{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:auto}.mh{font-weight:700;font-size:18px}
.slip .btn{color:var(--ptx);border-color:#b9ad90}.btn.sm{flex:0 0 48px;min-height:40px;font-size:20px}.bk .btn{width:100%;margin-top:8px}
.barw{flex:1;margin:0 10px;display:flex;align-items:center}.bar{display:block;height:10px;border-radius:5px;background:#e8a33d}.note{font-size:13px;color:#6b5f45;padding-top:8px}
h2{font-size:18px;font-weight:700;margin:26px 0 10px}
.slip{background:var(--paper);color:var(--ptx);border-radius:6px;padding:14px 16px;position:relative}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--paper) 5.5px) 0 0/12px 8px repeat-x}
.slip::before{top:-8px}
.slip::after{bottom:-8px;transform:scaleY(-1)}
.h{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #b9ad90;font-size:16px}
.h:last-child{border-bottom:none}
.h.hd{font-weight:700;font-size:18px;padding-bottom:10px;border-bottom:2px solid var(--ptx)}
.ed{display:flex;gap:8px;margin-bottom:8px}
.ed input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.ed input[type=number]{flex:0 0 84px}
.lnk{background:none;border:none;color:var(--mu);font:inherit;text-decoration:underline;padding:14px 0;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="slab"><b id="tp">₹0</b><span id="tn">0 snacks</span></div><div class="tabs" id="tabs"></div></div>
<div class="grid" id="g"></div>
<div class="row"><button class="btn" id="undo">Undo</button><button class="btn" id="move">Move</button><button class="btn pri" id="done">Done</button></div>
<details class="bd"><summary id="bsum">Bill details</summary><div class="slip" id="bl"></div></details>
<h2>Today</h2>
<div class="slip" id="sum"></div>
<button class="btn" id="endday" style="width:100%;margin-top:22px">End day</button>
<h2>Past days</h2>
<div class="slip" id="past"></div>
<h2>Month</h2>
<div class="slip" id="mon"></div>
<h2>Backup</h2>
<div class="slip" id="bk"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<button class="lnk" id="edit">Edit menu and prices</button>
<div id="ed" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="mv" hidden></div>
<script>
var $=function(i){return document.getElementById(i)};
var K='snackapp1',S,last=null,tt=null,COL=['#f2b84b','#e8715a','#6ec1e4','#b79bf0','#7fcf8a','#f08fb8'],GREY='#cfd8d6';
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.items)S={items:[['പഴംപൊരി',10],['ഉള്ളിവട',10],['മുട്ട ബജി',15],['മുളക് ബജി',10],['കാടമുട്ട',10],['എഗ്ഗ് റോസ്റ്റ്',20]],cur:{},hist:[],days:[]};
if(!S.hist)S.hist=[];if(!S.days)S.days=[];if(!S.day)S.day=String(Date.now());
if(!S.carts){S.carts=[{name:'Group 1',cur:S.cur||{}}];S.active=0;S.n=1}
S.carts.forEach(function(c,i){if(c.color==null)c.color=i%6;if(!c.cur)c.cur={};if(!c.log){c.log=[];for(var k in c.cur)for(var j=0;j<c.cur[k];j++)c.log.push({k:k,t:Date.now()})}});
if(S.ci==null)S.ci=S.carts.length;if(!S.n)S.n=S.carts.length;
if(!(S.active<S.carts.length))S.active=0;
sw(S.active)}
function sw(i){S.active=i;S.cur=S.carts[i].cur;S.log=S.carts[i].log}
function save(){try{localStorage.setItem(K,JSON.stringify(S,function(k,v){return(this===S&&(k==='cur'||k==='log'))?undefined:v}))}catch(e){}}
function vib(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function pr(k){for(var i=0;i<S.items.length;i++)if(S.items[i][0]===k)return S.items[i][1];return 0}
function tot(c){var n=0,p=0;S.items.forEach(function(it){var k=c[it[0]]||0;n+=k;p+=k*it[1]});return[n,p]}
function fmt(t){return new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}
function mk(txt,cls){var b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');b.textContent=txt;return b}
function say(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2000)}
function walkEntries(){var r=[];S.hist.forEach(function(h){if(h.w&&h.d===S.day){for(var k in h.c)r.push({k:k,t:h.t})}});r.sort(function(a,b){return a.t-b.t});return r}
function countsOf(es){var c={};es.forEach(function(e){c[e.k]=(c[e.k]||0)+1});return c}
function tap(k){vib();if(S.walk){var o={};o[k]=1;S.hist.push({d:S.day,c:o,w:1,t:Date.now()});say('Sold '+k+' · ₹'+pr(k))}else{S.cur[k]=(S.cur[k]||0)+1;S.log.push({k:k,t:Date.now()})}save();render()}
function minus(k){if(S.walk){for(var i=S.hist.length-1;i>=0;i--){var h=S.hist[i];if(h.w&&h.d===S.day&&h.c[k]){S.hist.splice(i,1);break}}}else{if(S.cur[k]>0)S.cur[k]--;for(var j=S.log.length-1;j>=0;j--)if(S.log[j].k===k){S.log.splice(j,1);break}}save();render()}
function renderTabs(){var t=$('tabs');t.innerHTML='';
var w=document.createElement('button');w.className='tab'+(S.walk?' on':'');
var d0=document.createElement('span');d0.className='dot';d0.style.background=GREY;w.appendChild(d0);w.appendChild(document.createTextNode('Quick sale'));
if(S.walk)w.style.borderColor=GREY;
w.onclick=function(){S.walk=true;save();render()};t.appendChild(w);
S.carts.forEach(function(c,i){var b=document.createElement('button'),on=!S.walk&&i===S.active,col=COL[c.color%6];
b.className='tab'+(on?' on':'');var d=document.createElement('span');d.className='dot';d.style.background=col;b.appendChild(d);b.appendChild(document.createTextNode(c.name));
if(on)b.style.borderColor=col;
var n=tot(c.cur)[0];if(n){var m=document.createElement('i');m.textContent=n;b.appendChild(m)}
b.onclick=function(){if(on){tabMenu(i);return}S.walk=false;sw(i);save();render()};t.appendChild(b)});
var a=document.createElement('button');a.className='tab';a.textContent='+ Group';a.onclick=function(){addCart(0)};t.appendChild(a);
var a2=document.createElement('button');a2.className='tab';a2.textContent='+ Person';a2.onclick=function(){addCart(1)};t.appendChild(a2)}
function addCart(p){S.walk=false;var nm;if(p){S.pn=(S.pn||0)+1;nm='Person '+S.pn}else{S.n++;nm='Group '+S.n}
S.carts.push({name:nm,p:p?1:0,cur:{},log:[],color:S.ci++%6});sw(S.carts.length-1);save();render()}
function render(){renderTabs();
var cart=S.carts[S.active],col=S.walk?GREY:COL[cart.color%6];
var es=S.walk?walkEntries():S.log,counts=S.walk?countsOf(es):S.cur;
var g=$('g');g.innerHTML='';
S.items.forEach(function(it){var c=counts[it[0]]||0,b=document.createElement('button');
b.className='it'+(c?'':' z')+(last===it[0]?' pop':'');
b.innerHTML='<span class="n"></span><span class="p">₹'+it[1]+'</span><span class="c">'+c+'</span>';
b.querySelector('.n').textContent=it[0];
b.onclick=function(){last=it[0];tap(it[0])};
if(c){var m=document.createElement('span');m.className='minus';m.textContent='−';m.setAttribute('aria-label','Remove one');m.onclick=function(e){e.stopPropagation();minus(it[0])};b.appendChild(m)}
g.appendChild(b)});last=null;
var n=es.length,p=0;es.forEach(function(e){p+=pr(e.k)});
$('tp').textContent='₹'+p;$('tn').textContent=n+(n==1?' snack':' snacks')+(S.walk?' today':'');
document.querySelector('.slab').style.background=col;
$('done').hidden=S.walk;$('move').hidden=false;
$('bsum').textContent=S.walk?'Quick sales today':'Bill details · '+cart.name;
var bl=$('bl');bl.innerHTML='';
if(!es.length)bl.innerHTML='<div class="h"><span>Nothing yet.</span></div>';
es.forEach(function(e){var r=document.createElement('div');r.className='h';var a=document.createElement('span');a.textContent=fmt(e.t)+'  '+e.k;var q=document.createElement('b');q.textContent='₹'+pr(e.k);r.appendChild(a);r.appendChild(q);bl.appendChild(r)});
if(es.length){var tr=document.createElement('div');tr.className='h hd';tr.innerHTML='<span>Total</span><b>₹'+p+'</b>';bl.appendChild(tr)}
var agg={},gp=0,gn=0,groups=0,walks=0,people=0;
S.hist.forEach(function(h){if(h.d!==S.day)return;if(h.w)walks++;else if(h.p)people++;else groups++;for(var k in h.c)agg[k]=(agg[k]||0)+h.c[k];var x=tot(h.c);gn+=x[0];gp+=x[1]});
var s=$('sum');s.innerHTML='';
if(!groups&&!walks&&!people){s.innerHTML='<div class="h"><span>No sales saved yet.</span></div>'}
else{var l=document.createElement('div');l.className='h hd';l.innerHTML='<span>'+groups+' groups · '+people+' people · '+walks+' quick · '+gn+' snacks</span><b>₹'+gp+'</b>';s.appendChild(l);
for(var k in agg){var r=document.createElement('div');r.className='h';var a=document.createElement('span');a.textContent=k;var q=document.createElement('b');q.textContent=agg[k]+' × ₹'+pr(k)+' = ₹'+agg[k]*pr(k);r.appendChild(a);r.appendChild(q);s.appendChild(r)}}
var pa=$('past');pa.innerHTML='';
if(!S.days.length){pa.innerHTML='<div class="h"><span>No closed days yet.</span></div>'}
else S.days.slice().reverse().forEach(function(d){var r=document.createElement('div');r.className='h';var a=document.createElement('span');a.textContent=d.label+' · '+d.n+' snacks';var q=document.createElement('b');q.textContent='₹'+d.p;r.appendChild(a);r.appendChild(q);pa.appendChild(r);
if(d.c){r.style.borderBottom='none';var t=document.createElement('div');t.style.cssText='font-size:14px;padding:0 0 8px;border-bottom:1px dashed #b9ad90;color:#5a4f38';var ps=[];for(var k in d.c)ps.push(k+' '+d.c[k]);t.textContent=ps.join(' · ');pa.appendChild(t)}})}
function tabMenu(i){var c=S.carts[i],m=$('mv');m.innerHTML='';m.hidden=false;var box=document.createElement('div');box.className='box';
var h=document.createElement('div');h.className='mh';h.textContent=c.name;box.appendChild(h);
var r=mk('Rename');r.onclick=function(){closeMv();var v=prompt('Rename',c.name);if(v&&v.trim()){c.name=v.trim();save();render()}};
var d=mk('Delete without saving');d.style.color='#e8715a';d.style.borderColor='#e8715a';
d.onclick=function(){var n=tot(c.cur)[0];if(n&&!confirm('Delete '+c.name+' and its '+n+(n==1?' snack':' snacks')+'? They will not be counted.'))return;closeMv();delCart(i)};
var x=mk('Cancel');x.onclick=closeMv;box.appendChild(r);box.appendChild(d);box.appendChild(x);m.appendChild(box)}
function delCart(i){if(S.carts.length>1){S.carts.splice(i,1);sw(Math.max(0,i-1))}else{var c0=S.carts[0];c0.cur={};c0.log=[];if(c0.p){c0.name='Person 1';S.pn=1}else{c0.name='Group 1';S.n=1}sw(0)}save();render()}
function closeMv(){$('mv').hidden=true}
function openMove(){var m=$('mv');m.innerHTML='';m.hidden=false;var box=document.createElement('div');box.className='box';
var h=document.createElement('div');h.className='mh';h.textContent='Which snack is in the wrong place?';box.appendChild(h);var any=false;
var src=S.walk?countsOf(walkEntries()):S.cur;
S.items.forEach(function(it){var c=src[it[0]]||0;if(!c)return;any=true;var b=mk(it[0]+' ('+c+')');b.onclick=function(){pickTarget(it[0])};box.appendChild(b)});
if(!any)h.textContent='Nothing to move here.';
var x=mk('Cancel');x.onclick=closeMv;box.appendChild(x);m.appendChild(box)}
function pickTarget(k){var m=$('mv');m.innerHTML='';var box=document.createElement('div');box.className='box';
var h=document.createElement('div');h.className='mh';h.textContent='Move one '+k+' to:';box.appendChild(h);
S.carts.forEach(function(c,i){if(!S.walk&&i===S.active)return;var b=mk(c.name);b.style.borderColor=COL[c.color%6];b.onclick=function(){moveSnack(k,i)};box.appendChild(b)});
if(!S.walk){var q=mk('Quick sale');q.style.borderColor=GREY;q.onclick=function(){moveSnack(k,-1)};box.appendChild(q)}
var x=mk('Cancel');x.onclick=closeMv;box.appendChild(x);m.appendChild(box)}
function moveSnack(k,i){var e=null,j;
if(S.walk){for(j=S.hist.length-1;j>=0;j--){var h=S.hist[j];if(h.w&&h.d===S.day&&h.c[k]){e={k:k,t:h.t};S.hist.splice(j,1);break}}}
else{var li=-1;for(j=S.log.length-1;j>=0;j--)if(S.log[j].k===k){li=j;break}e=li>-1?S.log.splice(li,1)[0]:{k:k,t:Date.now()};S.cur[k]--}
if(!e)e={k:k,t:Date.now()};
if(i<0){var o={};o[k]=1;S.hist.push({d:S.day,c:o,w:1,t:e.t});say('Moved '+k+' to quick sale')}
else{var T=S.carts[i];T.cur[k]=(T.cur[k]||0)+1;T.log.push(e);T.log.sort(function(a,b){return a.t-b.t});say('Moved '+k+' to '+T.name)}
closeMv();save();render()}
$('move').onclick=openMove;
function ymd(t){var d=new Date(t),z=function(x){return x<10?'0'+x:''+x};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
$('endday').onclick=function(){var n=0,p=0,c=0,ag={},pc={},hr=[],gr=0,pe=0,wk=0,d=S.day,t0=Infinity,i;for(i=0;i<24;i++)hr.push(0);
S.hist.forEach(function(h){if(h.d!==d)return;c++;if(h.w)wk++;else if(h.p)pe++;else gr++;
var x=tot(h.c);n+=x[0];p+=x[1];for(var k in h.c){ag[k]=(ag[k]||0)+h.c[k];pc[k]=(pc[k]||0)+h.c[k]*pr(k)}
if(h.t&&h.t<t0)t0=h.t;
if(h.l&&h.l.length){h.l.forEach(function(e){hr[new Date(e.t).getHours()]++;if(e.t<t0)t0=e.t})}else if(h.t){hr[new Date(h.t).getHours()]+=x[0]}});
if(!c){alert('No sales saved today.');return}if(!confirm('End the day? Total: '+n+' snacks, ₹'+p+'.'))return;
var t1=t0<Infinity?t0:Date.now();
S.days.push({ymd:ymd(t1),label:new Date(t1).toLocaleDateString('en-IN',{day:'numeric',month:'short'}),n:n,p:p,c:ag,pc:pc,hr:hr,g:gr,pe:pe,w:wk});S.hist=S.hist.filter(function(h){return h.d!==d});S.day=String(Date.now());save();render()};
$('undo').onclick=function(){if(S.walk){for(var i=S.hist.length-1;i>=0;i--){var h=S.hist[i];if(h.w&&h.d===S.day){S.hist.splice(i,1);break}}}else{var e=S.log.pop();if(e&&S.cur[e.k]>0)S.cur[e.k]--}save();render()};
$('done').onclick=function(){var t=tot(S.cur);
if(t[0])S.hist.push({d:S.day,c:S.cur,g:S.carts[S.active].name,p:S.carts[S.active].p?1:0,t:Date.now(),l:S.log});else if(S.carts.length<2){alert('Tap a snack first.');return}
if(S.carts.length>1){S.carts.splice(S.active,1);sw(Math.max(0,S.active-1))}else{var c0=S.carts[0];c0.cur={};c0.log=[];if(c0.p){c0.name='Person 1';S.pn=1}else{c0.name='Group 1';S.n=1}sw(0)}
save();vib();render()};
function buildEd(){var e=$('ed');e.innerHTML='';
S.items.forEach(function(it,i){var r=document.createElement('div');r.className='ed';
var a=document.createElement('input');a.value=it[0];a.onchange=function(){var o=it[0],w=a.value;S.carts.forEach(function(c){if(c.cur[o]!=null){c.cur[w]=c.cur[o];delete c.cur[o]}c.log.forEach(function(x){if(x.k===o)x.k=w})});it[0]=w;save();render()};
var p=document.createElement('input');p.type='number';p.value=it[1];p.onchange=function(){it[1]=Number(p.value)||0;save();render()};
var x=mk('×');x.style.cssText='flex:0 0 48px;min-height:40px';x.onclick=function(){S.items.splice(i,1);save();buildEd();render()};
r.appendChild(a);r.appendChild(p);r.appendChild(x);e.appendChild(r)});
var add=mk('Add item');add.onclick=function(){S.items.push(['New item',10]);save();buildEd();render()};e.appendChild(add)}
